<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnReceipt Explainer</title>
<!--
  The UnReceipt explainer video, as one deterministic HTML animation.
  Open it in a browser to preview (space = play/pause, arrows = step).
  render.mjs seeks it frame by frame and pipes the frames into ffmpeg.

  URL params: ?format=landscape|portrait  &lang=en  &t=12.5 (still frame)
  Colours, fonts and UI follow DESIGN.md; every claim matches the
  landing copy (src/app/_landing-copy.ts) — change both together.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@1,400;1,500;1,600&family=Geist+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&display=block">
<style>
  /* Layout concept: one stage, two frames. Landscape 1920×1080 (website)
     puts copy left and the product right; portrait 1080×1350 (LinkedIn)
     stacks copy over product. Same scenes, same timeline. */
  :root {
    --brand: #27BE7B;
    --brand-deep: #1F9D63;
    --brand-action: #1A7F52;
    --brand-tint: #ECF7E7;
    --surface: #FAFAF7;
    --card: #FFFFFF;
    --ink: #303568;
    --ink-muted: #5A5F7A;
    --ink-faint: #9CA0B8;
    --hairline: #E8E5DD;
    --night: #252850;
    --slot: #1C1F45;
    --negative: #C73E4E;
    --font-sans: "Manrope", system-ui, sans-serif;
    --font-accent: "Figtree", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #12142a; }
  body { font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .fmt-landscape { --W: 1920px; --H: 1080px; }
  .fmt-portrait { --W: 1080px; --H: 1350px; }

  #frame { position: relative; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H); overflow: hidden; background: var(--surface); transform-origin: 0 0; }
  .layer { position: absolute; inset: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .anim { will-change: transform, opacity; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* Paper: perforated top (PerfEdge) and torn bottom (.receipt-torn). */
  .paper { position: relative; background: var(--card); }
  .perf { height: 12px; background-image: radial-gradient(circle 6px at 12px 6px, var(--holes, var(--surface)) 6px, transparent 6.5px); background-size: 24px 12px; background-repeat: repeat-x; }
  .torn {
    -webkit-mask: linear-gradient(#000 0 0) 0 0 / 100% calc(100% - 12px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 0 100% / 22px 12px repeat-x;
    mask: linear-gradient(#000 0 0) 0 0 / 100% calc(100% - 12px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 0 100% / 22px 12px repeat-x;
  }
  .rule { border-top: 2px dashed var(--hairline); margin: 18px 0; }
  .lead { display: flex; align-items: baseline; gap: 10px; }
  .lead .l { flex-shrink: 0; font-weight: 600; color: var(--ink-muted); }
  .lead .dots { flex: 1; min-width: 16px; border-bottom: 2px dotted var(--hairline); transform: translateY(-6px); }
  .lead .v { flex-shrink: 0; color: var(--ink); }

  /* Wordmark (src/components/brand/Wordmark.tsx). */
  .wm { display: inline-flex; align-items: center; gap: 0.18em; line-height: 1; }
  .wm svg { width: 1.25em; height: 1.25em; flex-shrink: 0; overflow: visible; }
  .wm-text { font-weight: 800; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; display: inline-flex; align-items: baseline; }

  /* Merchant initials badge (src/lib/merchant-display.ts). */
  .badge { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; flex-shrink: 0; letter-spacing: 0.01em; }

  /* ── Scene 1: the hook ── */
  #s1 .hook { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #s1 h1 { margin: 0; font-weight: 800; letter-spacing: -0.04em; line-height: 0.98; color: var(--ink); }
  #s1 h1 span { display: block; }
  #s1 .sub { margin: 0; font-weight: 600; color: var(--ink-muted); line-height: 1.35; text-wrap: balance; }
  .fmt-landscape #s1 h1 { font-size: 132px; }
  .fmt-landscape #s1 .sub { font-size: 40px; margin-top: 40px; }
  .fmt-portrait #s1 h1 { font-size: 112px; }
  .fmt-portrait #s1 .sub { font-size: 36px; margin-top: 36px; max-width: 800px; }
  .chaos { position: absolute; left: 0; top: 0; }
  .mini { width: 150px; padding: 18px 16px 30px; border: 1.5px solid var(--hairline); border-bottom: 0; }
  .mini b { display: block; height: 10px; border-radius: 5px; background: var(--hairline); margin-top: 10px; }
  .mini b.s { width: 60%; margin: 0 auto 16px; background: #C9CBDA; }
  .mini b.t { background: #C9CBDA; width: 70%; margin-left: auto; margin-top: 16px; }
  .mailchip { display: flex; align-items: center; gap: 16px; padding: 16px 24px 16px 16px; background: var(--card); border: 1.5px solid var(--hairline); border-radius: 18px; white-space: nowrap; }
  .mailchip .ic { width: 52px; height: 52px; border-radius: 14px; background: var(--brand-tint); color: var(--brand-action); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .mailchip .t { font-size: 24px; font-weight: 700; color: var(--ink); }
  .mailchip .s { font-size: 18px; font-weight: 600; color: var(--ink-faint); margin-top: 4px; }
  .sheetchip { background: var(--card); border: 1.5px solid var(--hairline); border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 96px 128px 92px; font-size: 18px; }
  .sheetchip span { padding: 8px 12px; border-right: 1.5px solid var(--hairline); border-bottom: 1.5px solid var(--hairline); color: var(--ink-muted); font-weight: 600; white-space: nowrap; }
  .sheetchip span:nth-child(3n) { border-right: 0; }
  .sheetchip span.h { background: var(--surface); color: var(--ink); font-weight: 700; }
  .sheetchip span.err { color: var(--negative); font-family: var(--font-mono); font-weight: 600; }
  .sheetchip span.m { font-family: var(--font-mono); text-align: right; }

  /* ── Brand panels (zigzag edges, like the landing hero) ── */
  .panel { position: absolute; left: 0; width: 100%; top: -24px; height: calc(var(--H) + 48px);
    -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) 0 0 / 48px 24px repeat-x, linear-gradient(#000 0 0) 0 24px / 100% calc(100% - 48px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 0 100% / 48px 24px repeat-x;
    mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) 0 0 / 48px 24px repeat-x, linear-gradient(#000 0 0) 0 24px / 100% calc(100% - 48px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 0 100% / 48px 24px repeat-x; }
  #green { background: var(--brand); }
  #navy { background: var(--ink); }
  .panel .inner { position: absolute; left: 0; right: 0; top: 24px; height: var(--H); }
  .floaty { position: absolute; color: #fff; opacity: 0.1; }
  .floaty svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  #lockup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; background: rgba(255,255,255,0.16); color: #fff; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
  .fmt-landscape #lockup .pill { font-size: 22px; padding: 12px 26px; margin-bottom: 56px; }
  .fmt-portrait #lockup .pill { font-size: 20px; padding: 11px 22px; margin-bottom: 48px; }
  .fmt-landscape #lockup .wm { font-size: 156px; }
  .fmt-portrait #lockup .wm { font-size: 112px; }
  #lockup .tagline { margin: 0; color: #fff; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .fmt-landscape #lockup .tagline { font-size: 64px; margin-top: 60px; }
  .fmt-portrait #lockup .tagline { font-size: 54px; margin-top: 52px; max-width: 860px; text-wrap: balance; }

  /* ── Top bar: wordmark + the three steps ── */
  #topbar .mark { position: absolute; }
  .fmt-landscape #topbar .mark { left: 120px; top: 58px; font-size: 34px; }
  .fmt-portrait #topbar .mark { left: 72px; top: 66px; font-size: 32px; }
  #topbar .steps { position: absolute; display: flex; align-items: center; gap: 16px; margin: 0; padding: 0; list-style: none; white-space: nowrap; }
  .fmt-landscape #topbar .steps { right: 120px; top: 58px; }
  .fmt-portrait #topbar .steps { right: 72px; top: 64px; }
  .steps .st { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; }
  .steps .n { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; position: relative; }
  .steps .n i, .steps .l i { position: absolute; inset: 0; font-style: normal; display: flex; align-items: center; }
  .steps .n i { justify-content: center; border-radius: 50%; }
  .steps .n .off { border: 2px solid var(--hairline); color: var(--ink-faint); }
  .steps .n .on { background: var(--brand-action); color: #fff; }
  .steps .l { position: relative; display: block; }
  .steps .l i.ghost { position: static; visibility: hidden; }
  .steps .l .off { color: var(--ink-faint); }
  .steps .l .on { color: var(--ink); }
  .steps .bar { width: 44px; height: 2px; background: var(--hairline); }
  .fmt-portrait .steps .st { font-size: 22px; gap: 10px; }
  .fmt-portrait .steps .bar { width: 26px; }
  .fmt-portrait .steps .n { width: 38px; height: 38px; font-size: 18px; }

  /* ── Step copy ── */
  .copy { position: absolute; display: flex; flex-direction: column; }
  .fmt-landscape .copy { left: 120px; width: 740px; top: 150px; bottom: 60px; justify-content: center; }
  .fmt-portrait .copy { left: 72px; right: 72px; top: 170px; height: 300px; justify-content: flex-start; }
  .copy .eyebrow { margin: 0; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brand-action); }
  .copy h2 { margin: 0; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; color: var(--ink); text-wrap: balance; }
  .copy .sub { margin: 0; font-weight: 600; line-height: 1.38; color: var(--ink-muted); text-wrap: pretty; }
  .fmt-landscape .copy .eyebrow { font-size: 24px; margin-bottom: 26px; }
  .fmt-landscape .copy h2 { font-size: 92px; }
  .fmt-landscape .copy .sub { font-size: 36px; margin-top: 32px; max-width: 690px; }
  .fmt-portrait .copy .eyebrow { font-size: 22px; margin-bottom: 20px; }
  .fmt-portrait .copy h2 { font-size: 70px; }
  .fmt-portrait .copy .sub { font-size: 32px; margin-top: 22px; }

  /* ── Product visuals ── */
  .vis { position: absolute; display: flex; align-items: center; justify-content: center; }
  .fmt-landscape .vis { left: 900px; width: 900px; top: 120px; height: 920px; --vs: 1; }
  .fmt-portrait .vis { left: 0; width: 1080px; top: 480px; height: 850px; --vs: 0.92; }
  .fmt-portrait #s3 .vis { --vs: 1.12; }
  .fmt-portrait #s5 .vis { --vs: 0.96; }
  .fit { position: relative; transform: scale(var(--vs)); flex-shrink: 0; }

  /* Scene 3: email → forward → inbox card */
  #s3 .fit { width: 700px; height: 640px; }
  .mail { position: absolute; left: 0; top: 0; width: 700px; background: var(--card); border: 1.5px solid var(--hairline); border-radius: 26px; overflow: hidden; }
  .mail-head { display: flex; gap: 20px; align-items: center; padding: 30px 34px 24px; }
  .mail-head .av { width: 68px; height: 68px; border-radius: 50%; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; flex-shrink: 0; }
  .mail-head .who { flex: 1; min-width: 0; }
  .mail-head .from { display: flex; justify-content: space-between; align-items: baseline; font-size: 30px; font-weight: 800; color: var(--ink); }
  .mail-head .time { font-size: 22px; font-weight: 600; color: var(--ink-faint); }
  .mail-head .subj { font-size: 25px; font-weight: 600; color: var(--ink-muted); margin-top: 6px; }
  .mail-body { border-top: 1.5px solid var(--hairline); padding: 30px 34px 34px; height: 300px; position: relative; }
  .mail-body .lbl { font-size: 22px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.1em; }
  .mail-body .amt { font-size: 72px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); margin-top: 6px; }
  .mail-body b { display: block; height: 14px; border-radius: 7px; background: var(--hairline); margin-top: 18px; }
  .mail-actions { display: flex; gap: 16px; padding: 0 34px 32px; }
  .btn-o { display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 28px; border: 1.5px solid var(--hairline); border-radius: 14px; font-size: 24px; font-weight: 700; color: var(--ink); background: var(--card); }
  .btn-o svg { font-size: 26px; }
  .btn-o.fwd { position: relative; }
  .compose { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: var(--card); border-top: 1.5px solid var(--hairline); padding: 22px 34px 30px; }
  .compose .row { display: flex; align-items: center; gap: 18px; height: 70px; border-bottom: 1.5px solid var(--hairline); font-size: 24px; }
  .compose .row .k { width: 52px; font-weight: 700; color: var(--ink-faint); }
  .compose .addr { font-family: var(--font-mono); font-weight: 500; font-size: 25px; color: var(--ink); white-space: nowrap; }
  .compose .caret { display: inline-block; width: 3px; height: 30px; background: var(--brand-action); vertical-align: -6px; margin-left: 2px; }
  .compose .fsub { font-weight: 600; color: var(--ink-muted); }
  .compose .send { position: absolute; right: 34px; bottom: 30px; display: inline-flex; align-items: center; gap: 12px; height: 66px; padding: 0 32px; border-radius: 14px; background: var(--brand-action); color: #fff; font-size: 25px; font-weight: 800; }
  .inbox { position: absolute; left: 0; top: 230px; width: 700px; }
  .inbox .lab { font-size: 20px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 16px 6px; }

  /* Receipt list card (src/components/receipt/ReceiptListItem.tsx), video scale. */
  .rcard { display: flex; align-items: center; gap: 18px; background: var(--card); border: 1.5px solid var(--hairline); border-radius: 18px; padding: 20px 22px; }
  .rcard .badge { width: 62px; height: 62px; border-radius: 15px; font-size: 22px; }
  .rcard .mid { flex: 1; min-width: 0; }
  .rcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .rcard .name { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcard .amt { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
  .rcard .amt small { font-size: 18px; color: var(--ink-faint); margin-left: 4px; font-weight: 500; }
  .rcard .meta { font-size: 20px; font-weight: 500; color: var(--ink-faint); margin-top: 6px; white-space: nowrap; }
  .rcard .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--brand-tint); color: var(--brand-action); font-size: 16px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; vertical-align: 2px; margin-left: 10px; }

  /* Phone */
  .phone { position: absolute; width: 450px; height: 920px; border-radius: 70px; background: var(--ink); padding: 15px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: var(--surface); }
  .island { position: absolute; left: 50%; top: 30px; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: var(--ink); z-index: 20; }

  /* Scene 4: camera → reading → check and save */
  #s4 .fit { width: 450px; height: 920px; }
  .cam { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, #3a3d58 0%, #22243c 70%, #1a1c31 100%); }
  .cam .bracket { position: absolute; width: 54px; height: 54px; border: 4px solid rgba(255,255,255,0.85); }
  .cam .b1 { left: 34px; top: 120px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
  .cam .b2 { right: 34px; top: 120px; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
  .cam .b3 { left: 34px; bottom: 170px; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
  .cam .b4 { right: 34px; bottom: 170px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
  .cam .shutter { position: absolute; left: 50%; bottom: 50px; width: 92px; height: 92px; margin-left: -46px; border-radius: 50%; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; }
  .cam .shutter i { width: 70px; height: 70px; border-radius: 50%; background: #fff; display: block; }
  .cam .hint { position: absolute; left: 0; right: 0; top: 76px; text-align: center; color: rgba(255,255,255,0.85); font-size: 20px; font-weight: 700; }
  .slip { position: absolute; width: 300px; padding: 26px 22px 34px; font-family: var(--font-mono); color: #2b2d3a; font-size: 15px; line-height: 1.5; background: #fff; box-shadow: 0 30px 50px -20px rgba(0,0,0,0.55); }
  .slip .c { text-align: center; }
  .slip .store { font-weight: 600; font-size: 21px; letter-spacing: 0.08em; }
  .slip .r { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
  .slip .hr { border-top: 2px dashed #b9bac4; margin: 10px 0; }
  .slip .tot { font-weight: 600; font-size: 18px; }
  .slip .bars { height: 34px; margin: 14px 18px 0; background: repeating-linear-gradient(90deg, #2b2d3a 0 2px, transparent 2px 5px, #2b2d3a 5px 6px, transparent 6px 9px, #2b2d3a 9px 12px, transparent 12px 14px); }
  .sheet { position: absolute; inset: 0; background: var(--card); padding: 84px 26px 26px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .sheet-head .tt { position: relative; flex: 1; height: 48px; }
  .sheet-head .tt span { position: absolute; left: 0; top: 0; line-height: 48px; font-size: 25px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .sheet-head .x { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); font-size: 26px; }
  .reading, .review { position: absolute; left: 26px; right: 26px; top: 152px; }
  .reading .rhead { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .reading .thumb { width: 210px; height: 300px; border-radius: 16px; }
  .reading .thumb .slip { transform: scale(0.66); left: 3px; top: 3px; }
  .thumb { position: relative; width: 104px; height: 140px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--hairline); background: #fff; flex-shrink: 0; }
  .thumb .slip { transform: scale(0.34); transform-origin: 0 0; left: 2px; top: 2px; box-shadow: none; }
  .thumb .scan { position: absolute; left: 0; right: 0; height: 4px; background: var(--brand); box-shadow: 0 0 16px 4px rgba(39,190,123,0.55); }
  .status { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--ink); }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--brand); }
  .sk { height: 22px; border-radius: 8px; background: #EFEDE7; margin-top: 18px; }
  .review .hero { display: flex; gap: 16px; align-items: flex-start; }
  .review .hero .thumb { width: 74px; height: 98px; }
  .review .hero .thumb .slip { transform: scale(0.24); }
  .review .tp { font-size: 16px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
  .review .tv { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .review .tv .mono { font-size: 42px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); line-height: 1; }
  .review .cur { height: 40px; padding: 0 12px; border: 1.5px solid var(--hairline); border-radius: 999px; display: flex; align-items: center; font-size: 18px; font-weight: 800; color: var(--ink); }
  .vatp { margin-top: 20px; background: var(--brand-tint); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; font-size: 20px; }
  .vatp .lead .l { color: var(--ink); }
  .vatp .lead .dots { border-color: rgba(48,53,104,0.18); }
  .rows { margin-top: 18px; border: 1.5px solid var(--hairline); border-radius: 16px; overflow: hidden; }
  .rows .rw { display: flex; align-items: center; height: 60px; padding: 0 18px; border-top: 1.5px solid var(--hairline); font-size: 20px; }
  .rows .rw:first-child { border-top: 0; }
  .rows .rw .k { width: 112px; font-weight: 600; color: var(--ink-muted); flex-shrink: 0; }
  .rows .rw .v { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .review .note { margin-top: 18px; font-size: 17px; font-weight: 600; color: var(--ink-muted); }
  .savebtn { margin-top: 14px; height: 64px; border-radius: 14px; background: var(--brand-action); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }

/* ── Timeline helpers ── */
function bezier(x1, y1, x2, y2) {
  // Newton-Raphson solve of a CSS cubic-bezier, good to ~1e-6.
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const err = sx(t) - x;
      if (Math.abs(err) < 1e-6) break;
      const d = dx(t);
      if (Math.abs(d) < 1e-6) break;
      t -= err / d;
    }
    let lo = 0, hi = 1;
    if (Math.abs(sx(t) - x) > 1e-5) {
      t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    }
    return sy(t);
  };
}
// DESIGN.md motion: entrance spring-out, ease-in exit, gentle overshoot.
const E = { out: bezier(0.32, 0.72, 0, 1), in: bezier(0.4, 0, 1, 1), pop: bezier(0.34, 1.56, 0.64, 1), io: bezier(0.65, 0, 0.35, 1), lin: (x) => x };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function put(el, o = 1, x = 0, y = 0, s = 1, r = 0) {
  if (!el) return;
  el.style.opacity = o.toFixed(4);
  el.style.visibility = o < 0.002 ? "hidden" : "visible";
  el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(3)}deg)`;
}
// Fade-up in at a, fade-up out at b.
function inout(t, a, b, rise = 34, dIn = 0.62, dOut = 0.34) {
  const ki = E.out(prog(t, a, a + dIn));
  const ko = E.in(prog(t, b, b + dOut));
  return { o: ki * (1 - ko), y: lerp(rise, 0, ki) - 26 * ko };
}
function press(t, at, depth = 0.06, dur = 0.26) {
  const k = prog(t, at, at + dur);
  return k <= 0 || k >= 1 ? 1 : 1 - depth * Math.sin(Math.PI * k);
}
const P = FORMAT === "portrait";

/* ── Scenes ── */
const s1 = $("#s1"), s3 = $("#s3"), s4 = $("#s4"), s5 = $("#s5"), s6 = $("#s6");
const show = (el, on) => { el.style.display = on ? "" : "none"; };

const CHAOS = P
  ? { p1: [40, 110, -12], p2: [880, 150, 9], p3: [60, 1000, 7], p4: [880, 1010, -8], e1: [150, 300, -2.5], e2: [280, 1190, 2], e3: [250, 860, -3], x1: [560, 104, 3] }
  : { p1: [150, 120, -12], p2: [1650, 92, 9], p3: [118, 700, 7], p4: [1636, 680, -8], e1: [520, 96, -2.5], e2: [1080, 900, 2], e3: [300, 890, -3], x1: [1180, 150, 3] };

function copyBlock(sec, t, a, b) {
  const [eb, h, sub] = $$(".copy > *", sec);

  k = inout(t, a + 0.1, b); put(h, k.o, 0, k.y);
  k = inout(t, a + 0.24, b); put(sub, k.o, 0, k.y);
}

function scene1(t) {
  show(s1, t < 4.3);
  if (t >= 4.3) return;
  const W = P ? 1080 : 1920, H = P ? 1350 : 1080;
  $$(".chaos", s1).forEach((el, i) => {
    const [x, y, r] = CHAOS[el.dataset.c];
    const ph = i * 1.7;
    const dx = Math.sin(t * 0.9 + ph) * 10, dy = Math.cos(t * 0.7 + ph) * 12, dr = Math.sin(t * 0.6 + ph) * 1.6;
    // Collected at the end: pulled down into the rising brand panel.
    const k = E.in(prog(t, 3.05 + (i % 4) * 0.05, 3.75 + (i % 4) * 0.05));
    const tx = lerp(0, W / 2 - x - 120, k), ty = lerp(0, H + 120 - y, k);
    put(el, 1 - k * 0.2, x + dx + tx, y + dy + ty, 1 - 0.4 * k, r + dr + k * (i % 2 ? 24 : -24));
  });

  const ki = E.out(prog(t, 0, 0.9));
  put($("#h1a"), 1 - ko, 0, -30 * ko, lerp(1.035, 1, ki));
  put($("#h1b"), 1 - ko, 0, -30 * ko, lerp(1.035, 1, ki));
  const ks = E.out(prog(t, 0.75, 1.35));
  put($("#s1sub"), ks * (1 - ko), 0, lerp(26, 0, ks) - 30 * ko);
}

function brand(t) {
  const H = P ? 1350 : 1080;

  const kin = E.io(prog(t, 3.4, 4.12)), kout = E.io(prog(t, 6.72, 7.42));
  const y = lerp(H + 30, 0, kin) - (H + 60) * kout;
  g.style.transform = `translateY(${y.toFixed(2)}px)`;
  show(g, t > 3.38 && t < 7.45);
  if (t <= 3.38 || t >= 7.45) return;
  $$(".floaty", g).forEach((el, i) => put(el, 1, Math.sin(t * 0.8 + i) * 14, Math.cos(t * 0.6 + i * 2) * 18, 1, Math.sin(t * 0.5 + i) * 8));
  const mark = $("#bigmark");
  const kp = E.pop(prog(t, 3.95, 4.5));
  const svg = $("svg", mark), text = $(".wm-text", mark);
  svg.style.transformOrigin = "60% 60%";
  put(svg, prog(t, 3.95, 4.15), 0, 0, lerp(0.4, 1, kp), lerp(-20, 0, kp));
  const arc = $(".iso-arc", mark);
  arc.style.strokeDasharray = "58";
  arc.style.strokeDashoffset = (58 * (1 - E.out(prog(t, 4.1, 4.75)))).toFixed(2);
  $(".iso-head", mark).style.opacity = prog(t, 4.6, 4.72).toFixed(3);
  const kt = E.out(prog(t, 4.3, 4.95));
  text.style.clipPath = `inset(-10% ${(100 - 100 * kt).toFixed(2)}% -20% 0)`;
  put(text, 1, lerp(-24, 0, kt), 0);
  put(mark, 1);
  const kb = E.out(prog(t, 4.75, 5.3));
  put($("#lockup .pill"), kb, 0, lerp(18, 0, kb));
  const kg = E.out(prog(t, 4.95, 5.55));
  put($("#lockup .tagline"), kg, 0, lerp(26, 0, kg));
}

function topbar(t) {

  put($(".mark", tb), k.o);
  put($("#steps"), k.o);

    // Each step is lit from its scene's start; changes cross-fade over 0.3 s.
    const at = [7.2, 18.7, 24.3][i], until = [18.7, 24.3, 99][i];
    const on = prog(t, at, at + 0.3) * (1 - prog(t, until, until + 0.3));
    $$(".on", st).forEach((el) => { el.style.opacity = on.toFixed(3); });
    $$(".off", st).forEach((el) => { el.style.opacity = (1 - on).toFixed(3); });
  });
}

function scene3(t) {
  show(s3, t > 7.0 && t < 13.0);
  if (t <= 7.0 || t >= 13.0) return;
  copyBlock(s3, t, 7.3, 12.45);
  const mail = $(".mail", s3), inbox = $(".inbox", s3);
  // Email in, Forward tapped, address typed, sent, lands in the inbox.
  const km = E.out(prog(t, 7.2, 7.85));
  const kfly = E.in(prog(t, 10.45, 10.85));
  put(mail, km * (1 - kfly), 0, lerp(46, 0, km) + 60 * kfly, 1 - 0.3 * kfly);
  put($(".fwd", s3), 1, 0, 0, press(t, 8.3));
  $(".fwd", s3).style.background = t > 8.3 && t < 8.75 ? "var(--brand-tint)" : "";
  const kc = E.out(prog(t, 8.5, 8.95));
  put($(".compose", s3), kc, 0, lerp(330, 0, kc));
  const addr = T.s3.address;
  const n = Math.round(addr.length * prog(t, 8.95, 10.05));
  $("#addr").textContent = addr.slice(0, n);
  const typing = t > 8.95 && t < 10.05;
  put($(".caret", s3), typing || Math.floor(t * 2) % 2 === 0 ? 1 : 0);
  put($(".send", s3), 1, 0, 0, press(t, 10.25));
  $(".send", s3).style.background = t > 10.25 && t < 10.6 ? "#176E47" : "";
  const ki = E.out(prog(t, 10.82, 11.42));
  const kout = E.in(prog(t, 12.45, 12.8));
  put(inbox, ki * (1 - kout), -40 * kout, lerp(-30, 0, ki), lerp(0.94, 1, ki));

function scene4(t) {
  show(s4, t > 12.6 && t < 18.9);
  if (t <= 12.6 || t >= 18.9) return;
  copyBlock(s4, t, 12.85, 18.5);
  const ph = $(".phone", s4);
  const ki = E.out(prog(t, 12.7, 13.35)), ko = E.in(prog(t, 18.42, 18.78));
  put(ph, ki * (1 - ko), 0, lerp(70, 0, ki) + 30 * ko, 1 - 0.04 * ko);
  // Camera: hand-held drift, shutter at 13.75, flash.
  put($("#bigslip"), 1, Math.sin(t * 2.1) * 3, Math.cos(t * 1.7) * 4, 1, -3 + Math.sin(t * 1.3) * 0.6);
  put($(".shutter i", s4), 1, 0, 0, press(t, 13.7, 0.16, 0.3));
  const fl = t < 13.86 ? prog(t, 13.8, 13.86) : 1 - prog(t, 13.86, 14.25);
  put($(".flash", s4), fl * 0.92);
  put($(".sheet", s4), t >= 13.86 ? 1 : 0);
  // Reading → review: every field fades in together over 480 ms.
  const kr = prog(t, 15.45, 15.93);
  put($(".reading", s4), 1 - kr);
  put($(".review", s4), E.out(kr));
  const [titleA, titleB] = $$(".sheet-head .tt span", s4);
  put(titleA, 1 - kr);
  put(titleB, kr);
  const scanY = ((t - 13.9) % 1.3) / 1.3;
  put($(".scan", s4), 1, 0, lerp(-4, 300, E.io(clamp(scanY))));
  put($(".dot", s4), 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 6)));
  $$(".sk", s4).forEach((el, i) => { el.style.opacity = (0.65 + 0.35 * Math.sin(t * 4 - i * 0.5)).toFixed(3); });
  put($(".savebtn", s4), 1, 0, 0, press(t, 18.05, 0.05));
  $(".savebtn", s4).style.background = t > 18.05 && t < 18.4 ? "#176E47" : "";
}

function scene5(t) {
  show(s5, t > 18.6 && t < 24.8);
  if (t <= 18.6 || t >= 24.8) return;
  copyBlock(s5, t, 18.85, 24.08);
  const dr = $(".dr", s5);
  const kp = E.out(prog(t, 18.75, 20.0));
  const ko = E.in(prog(t, 24.08, 24.42));
  // Prints top to bottom, then the VERIFIED stamp lands.
  dr.style.clipPath = `inset(0 0 ${(100 - 100 * kp).toFixed(2)}% 0)`;
  const bump = t > 21.3 ? Math.sin(Math.PI * prog(t, 21.3, 21.5)) * 5 : 0;
  put(dr, prog(t, 18.75, 18.95) * (1 - ko), 0, lerp(30, 0, kp) + bump - 30 * ko);
  const st = $(".stamp", s5);
  const ks = E.pop(prog(t, 21.1, 21.55));
  st.style.transformOrigin = "50% 50%";
  put(st, prog(t, 21.1, 21.2), 0, 0, lerp(2.1, 1, ks), lerp(-16, -6, ks));
}

function scene6(t) {
  show(s6, t > 24.2 && t < 30.7);
  if (t <= 24.2 || t >= 30.7) return;
  copyBlock(s6, t, 24.5, 99);
  const ph = $(".phone", s6);
  const ki = E.out(prog(t, 24.48, 25.1));
  put(ph, ki, 0, lerp(70, 0, ki));
  const kx = E.out(prog(t, 26.55, 27.15));
  put($(".scrim", s6), kx);
  put($(".xsheet", s6), 1, 0, lerp(560, 0, kx));
  put($(".dlbtn", s6), 1, 0, 0, press(t, 28.25, 0.05));
  $(".dlbtn", s6).style.background = t > 28.25 && t < 28.6 ? "#176E47" : "";
}

let printed = null; // measured line bottoms of the summary receipt
function measureSummary() {
  const sum = $("#sum");
  const top = sum.getBoundingClientRect().top;
  const scale = sum.getBoundingClientRect().height / sum.offsetHeight;
  const lines = $$(".pl", sum).map((el) => (el.getBoundingClientRect().bottom - top) / scale);
  printed = { lines, full: sum.offsetHeight };
}

function scene7(t) {
  const H = P ? 1350 : 1080;
  const nv = $("#navy");
  const kin = E.io(prog(t, 29.85, 30.55));
  nv.style.transform = `translateY(${lerp(H + 30, 0, kin).toFixed(2)}px)`;
  show(nv, t > 29.83);
  if (t <= 29.83) return;
  if (!printed) measureSummary();
  const [h, sub, cta] = $$(".s7-copy > *");
  let k = E.out(prog(t, 30.45, 31.1));
  put(h, k, 0, lerp(34, 0, k));
  k = E.out(prog(t, 35.9, 36.5));
  put(sub, k, 0, lerp(26, 0, k));
  k = E.out(prog(t, 36.15, 36.8));
  put(cta, k, 0, lerp(26, 0, k));
  // The receipt prints out of the slot, line by line, then tears off.
  const { lines, full } = printed;
  const t0 = 30.9, dt = 0.28;
  let shown = 0;
  for (let i = 0; i < lines.length; i++) {
    const ki = E.out(prog(t, t0 + i * dt, t0 + i * dt + dt * 0.95));
    const prev = i ? lines[i - 1] : 0;
    if (ki > 0) shown = lerp(prev, lines[i], ki);
  }
  const tEnd = t0 + lines.length * dt;
  shown = lerp(shown, full, E.out(prog(t, tEnd, tEnd + 0.3)));
  const tear = E.pop(prog(t, tEnd + 0.35, tEnd + 0.8));
  const sum = $("#sum");
  sum.style.clipPath = `inset(0 0 ${(full - shown).toFixed(2)}px 0)`;
  put(sum, 1, 0, full - shown - 26 * tear);
  const kslot = E.in(prog(t, tEnd + 0.5, tEnd + 0.9));
  put($(".slot"), prog(t, 30.4, 30.7) * (1 - kslot), 0, 14 * kslot);
}

function seek(t) {
  scene1(t);
  brand(t);
  topbar(t);
  scene3(t);
  scene4(t);
  scene5(t);
  scene6(t);
  scene7(t);
}

/* ── Boot ── */
const stage = $("#stage"), frame = $("#frame");
const W = P ? 1080 : 1920, Hh = P ? 1350 : 1080;
function fit() {
  if (RENDER) { frame.style.width = `${W}px`; frame.style.height = `${Hh}px`; return; }
  const s = Math.min(innerWidth / W, (innerHeight - 56) / Hh);
  stage.style.transform = `scale(${s})`;
  frame.style.width = `${W * s}px`;
  frame.style.height = `${Hh * s}px`;
  frame.style.margin = "0 auto";
}
fit();
addEventListener("resize", fit);

window.DURATION = DURATION;
window.seek = seek;
const FONTS = ['500 20px "Manrope"', '600 20px "Manrope"', '700 20px "Manrope"', '800 20px "Manrope"', 'italic 500 20px "Figtree"', '500 20px "Geist Mono"', '600 20px "Geist Mono"'];
window.ready = Promise.all(FONTS.map((f) => document.fonts.load(f).catch(() => null)))
  .then(() => document.fonts.ready)
  .then(() => { measureSummary(); seek(Number(params.get("t") || 0)); return true; });

if (!RENDER) {
  const play = $("#play"), scrub = $("#scrub"), clock = $("#clock"), fmt = $("#fmt");
  scrub.max = DURATION;
  fmt.value = FORMAT;
  fmt.addEventListener("change", () => { params.set("format", fmt.value); location.search = params.toString(); });
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let playing = !reduced && !params.has("t");
  let t = Number(params.get("t") || (reduced ? 39 : 0));
  let last = null;
  const draw = () => { seek(t); scrub.value = t; clock.textContent = `${t.toFixed(2)} s`; play.textContent = playing ? "Pause" : "Play"; };
  const loop = (now) => {
    if (playing && last != null) { t += (now - last) / 1000; if (t >= DURATION) t = 0; }
    last = now;
    draw();
    requestAnimationFrame(loop);
  };
  window.ready.then(() => requestAnimationFrame(loop));
  play.addEventListener("click", () => { playing = !playing; });
  scrub.addEventListener("input", () => { t = Number(scrub.value); playing = false; });
  addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("#controls") && e.key !== " ") return;
    if (e.key === " ") { e.preventDefault(); playing = !playing; }
    if (e.key === "ArrowRight") { t = Math.min(DURATION, t + 1 / 30); playing = false; }
    if (e.key === "ArrowLeft") { t = Math.max(0, t - 1 / 30); playing = false; }
  });
}
</script>
