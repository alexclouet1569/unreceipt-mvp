name: Checks

# Runs on every pull request (and on main after a merge) so a broken
# type, lint error or failing unit test shows up as a red check on the PR
# before it reaches production. Vercel still builds and deploys on its own.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on high/critical advisories in what ships to production.
      # Dev-only tooling (eslint, playwright, the shadcn CLI) is excluded.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
